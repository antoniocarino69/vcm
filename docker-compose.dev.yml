# Solo per lo sviluppo/test locale: espone le porte dei servizi dati.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"   # solo loopback: il DB non va esposto in rete
  redis:
    ports:
      - "127.0.0.1:6379:6379"
